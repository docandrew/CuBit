# Run Meson from the repository root with its native build tools in PATH.
# This is a cross target, never a Linux execution wrapper.
[constants]
repo = '@DIRNAME@' / '../..'
[binaries]
c = repo / 'userspace/libc/cubit-cc'
cpp = repo / 'userspace/libc/cubit-c++'
ar = 'ar'
strip = 'strip'
pkg-config = '/bin/false'
[host_machine]
system = 'cubit'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
[properties]
needs_exe_wrapper = true
[built-in options]
default_library = 'static'
# CuBit's musl headers expose the POSIX/GNU declarations Mesa uses under
# this feature macro. Mesa does not supply it for the new 'cubit' OS name.
c_args = ['-D_GNU_SOURCE', '-D__cubit__']
cpp_args = ['-D_GNU_SOURCE', '-D__cubit__']
