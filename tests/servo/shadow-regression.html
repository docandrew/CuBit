<title>Shadow regression</title><style>body{margin:0;font-family:sans-serif}.grid{display:grid;grid-template-columns:repeat(4,160px);gap:28px;padding:30px}.box{height:70px;background:#eef;border:1px solid #346;box-shadow:8px 9px 12px 3px #4688}.r{border-radius:32px 5px 20px 10px}.in{box-shadow:inset 8px 9px 12px 3px #468c}.zero{box-shadow:8px 8px 0 #468}.off{transform:translate(.3px,.7px)}.rot{transform:rotate(12deg)}.scale{transform:scale(.8,1.1)}.ellipse{border-radius:50% / 25%}</style><div class=grid><div class="box ">square</div><div class="box r">r</div><div class="box in">in</div><div class="box r in">r in</div><div class="box zero">zero</div><div class="box r zero">r zero</div><div class="box off">off</div><div class="box r off">r off</div><div class="box rot">rot</div><div class="box r rot">r rot</div><div class="box scale">scale</div><div class="box r scale">r scale</div><div class="box ellipse">ellipse</div><div class="box ellipse in">ellipse in</div><div class="box ellipse off">ellipse off</div><div class="box ellipse rot">ellipse rot</div></div>
