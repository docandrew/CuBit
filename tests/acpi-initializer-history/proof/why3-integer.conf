# Additional encoding of the same obligations, not an axiom or a waiver.
# CVC5 is already pinned by the repository's Nix development environment.
[prover]
name = "CVC5 Integer Encoding"
shortcut = "cvc5_int"
version = "1.3.4"
driver = "cvc5_gnatprove"
command = "/nix/store/kpamqxdkwynzxyzhqj4csy6h5qj0pz21-cvc5-1.3.4/bin/cvc5 --solve-bv-as-int=sum --prenex-quant=none --stats-internal %f"
command_steps = "/nix/store/kpamqxdkwynzxyzhqj4csy6h5qj0pz21-cvc5-1.3.4/bin/cvc5 --solve-bv-as-int=sum --rlimit=%S --prenex-quant=none --stats-internal %f"
