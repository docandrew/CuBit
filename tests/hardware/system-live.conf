# CuBit live-system configuration
#
# Deliberately omit config.store: a live boot must not persist configuration
# or write to an internal disk merely because a block driver recognizes it.

scheme.fs.driver=6
scheme.fs.slot=1

scheme.ata.driver=6
scheme.ata.slot=1
scheme.nvme.driver=6
scheme.nvme.slot=1

scheme.config.driver=11
scheme.config.slot=20

scheme.net.driver=3
scheme.net.slot=11

scheme.mixer.driver=9
scheme.mixer.slot=14

scheme.proc.driver=4
scheme.proc.slot=12

scheme.desktop.driver=15
scheme.desktop.slot=21

scheme.display.driver=16
scheme.display.slot=22

net.if0.method=static
net.if0.address=10.0.2.15
net.if0.netmask=255.255.255.0
net.if0.gateway=10.0.2.2
net.dns.primary=10.0.2.3
