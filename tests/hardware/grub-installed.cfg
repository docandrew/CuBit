# The installed system's loader (SYS-001), embedded in the UEFI fallback
# loader \EFI\BOOT\BOOTX64.EFI on the ESP: the kernel and its bootstrap
# archive from the same ESP, as the live medium boots them.
serial --speed=115200 --unit=0
terminal_input serial console
terminal_output serial console
insmod part_gpt
insmod fat
insmod all_video
insmod multiboot2
search --no-floppy --file /BOOT/KERNEL --set=root
set default=0
set timeout=1

menuentry "CuBit" {
    echo "Loading CuBit kernel..."
    multiboot2 /BOOT/KERNEL
    set gfxpayload=3840x2160x32,2560x1440x32,1920x1080x32,1600x900x32,1366x768x32,1280x720x32,1024x768x32
    echo "Loading bootstrap archive..."
    module2 /BOOT/INITRD.IMG init.img
    echo "Handing off to CuBit..."
}
