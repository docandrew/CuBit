serial --speed=115200 --unit=0
terminal_input serial console
terminal_output serial console
# UEFI has GOP/UGA rather than BIOS VBE. Load the available video adapters
# before Multiboot requests a framebuffer; otherwise EFI boots without one.
insmod all_video
# Multiboot2 carries ACPI explicitly on UEFI. Keep the tested BIOS path and
# legacy text diagnostic entry available without reinterpreting their ABI.
if [ "$grub_platform" = "efi" ]; then
    set cubit_loader=multiboot2
    set cubit_module=module2
else
    set cubit_loader=multiboot
    set cubit_module=module
fi
set default=0
set timeout=3

menuentry "CuBit USB Live - native optical application loading" {
    echo "Loading CuBit kernel..."
    $cubit_loader /boot/cubit_kernel
    set gfxpayload=1920x1080x32,1600x900x32,1366x768x32,1280x720x32,1024x768x32
    echo "Loading bootstrap archive..."
    $cubit_module /boot/initrd.img init.img
    echo "Handing off to CuBit..."
}

menuentry "CuBit USB Live - fallback 1024x768" {
    echo "Loading CuBit kernel..."
    $cubit_loader /boot/cubit_kernel
    set gfxpayload=1024x768x32
    echo "Loading bootstrap archive..."
    $cubit_module /boot/initrd.img init.img
    echo "Handing off to CuBit..."
}

menuentry "CuBit USB Live - EARLY BOOT DIAGNOSTICS (legacy text mode)" {
    echo "Loading diagnostic kernel..."
    multiboot /boot/cubit_kernel
    set gfxpayload=text
    echo "Loading bootstrap archive..."
    module /boot/initrd.img init.img
    echo "Handoff next: look for B0, B1, B2 and early boot checkpoints."
    sleep 2
}
