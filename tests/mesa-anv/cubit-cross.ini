[constants]
compiler = '@DIRNAME@' / 'native-compiler.sh'
[binaries]
c = ['bash', compiler, 'c']
cpp = ['bash', compiler, 'cpp']
ar = 'ar'
strip = 'strip'
pkg-config = '/bin/false'
[host_machine]
system = 'cubit'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
[properties]
needs_exe_wrapper = true
[built-in options]
default_library = 'static'
c_args = ['-D_GNU_SOURCE', '-D__cubit__']
cpp_args = ['-D_GNU_SOURCE', '-D__cubit__']
