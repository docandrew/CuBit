# CuBit System Configuration
# Loaded by devmgr at boot, seeded into config.svc

# Persistence backing store (config.dat on disk)
config.store=@nvme:0/config.dat

# Scheme registry: scheme.<name>.driver=<driver_id>
#                  scheme.<name>.slot=<cap_slot>
#
# driver = the DRIVER_* ID (for PID lookup via sysinfo)
# slot   = the cap slot clients use to capCall the service

# Filesystem (bare paths and @fs: prefix)
scheme.fs.driver=6
scheme.fs.slot=1

# ATA/NVMe disk files — routed through FS server
scheme.ata.driver=6
scheme.ata.slot=1
scheme.nvme.driver=6
scheme.nvme.slot=1

# Config store
scheme.config.driver=11
scheme.config.slot=20

# Network (TCP/UDP via netstack)
scheme.net.driver=3
scheme.net.slot=11

# Audio mixer
scheme.mixer.driver=9
scheme.mixer.slot=14

# Process manager
scheme.proc.driver=4
scheme.proc.slot=12

# Network interface configuration
net.if0.method=static
net.if0.address=10.0.2.15
net.if0.netmask=255.255.255.0
net.if0.gateway=10.0.2.2
net.dns.primary=10.0.2.3
