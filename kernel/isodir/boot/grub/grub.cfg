serial --speed=115200 --unit=0
terminal_input serial console
terminal_output serial console

set default=0
set timeout=0
#GRUB_GFXMODE=1024x768x16
pager=1
color_normal=light-blue/black
menu_color_normal=cyan/black
menu_color_highlight=light-cyan/black

menuentry "DOOM on CuBit (1024x768x32)" {
	multiboot /boot/cubit_kernel
    set gfxpayload=1024x768x32
    module /boot/initrd.img init.img
}

menuentry "CuBit Net Test (netstack)" {
	multiboot /boot/cubit_kernel
    set gfxpayload=text
    module /boot/initrd.img init.img
}

menuentry "CuBit wget Test" {
	multiboot /boot/cubit_kernel
    set gfxpayload=text
    module /boot/initrd.img init.img
}

menuentry "CuBit Shell (ATA)" {
	multiboot /boot/cubit_kernel
    set gfxpayload=1024x768x32
    module /boot/initrd.img init.img
}

menuentry "CuBit Shell (NVMe)" {
	multiboot /boot/cubit_kernel
    set gfxpayload=1024x768x32
    module /boot/initrd.img init.img
}

menuentry "CuBit Audio Test (HDA)" {
	multiboot /boot/cubit_kernel
    set gfxpayload=1024x768x32
    module /boot/initrd.img init.img
}

menuentry "Cubit OS (Text, no modules)" {
	multiboot /boot/cubit_kernel
    set gfxpayload=text
}

menuentry "CuBit Laptop Live (initrd only)" {
	multiboot /boot/cubit_kernel
    set gfxpayload=1024x768x32
    module /boot/laptop-live-initrd.img init.img
}
