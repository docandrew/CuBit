[package]
name = "cubit-fonts"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
ab_glyph_rasterizer = { version = "=0.1.10", default-features = false, features = ["libm"] }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["no-std-float", "opentype-layout"] }
libm = "=0.2.16"

[dev-dependencies]
# Pixel-equivalence oracle; not part of the native font engine.
ab_glyph = { version = "=0.2.32", default-features = false, features = ["libm"] }

# The native staticlib Ada programs link (make ui-fonts-native): no std, its
# own allocator (CuAlloc) and panic handler. Without it (hosted tests, Servo
# on CuBit's std) the crate uses std's.
[features]
native = ["dep:cubit-allocator", "dep:cubit"]

[dependencies.cubit-allocator]
path = "../allocator"
optional = true

[dependencies.cubit]
path = "../cubit"
optional = true
