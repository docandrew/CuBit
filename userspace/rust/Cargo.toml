[workspace]
members = ["cubit", "allocator", "probe", "fonts"]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = 2
overflow-checks = true
debug = 1

# The native font engine (make ui-fonts-native): one codegen unit and
# whole-program LTO at opt-level 3. Its target's CPU baseline is
# x86-64-v3 (std/x86_64-unknown-cubit.json).
[profile.fonts]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "fat"

[profile.dev]
panic = "abort"
