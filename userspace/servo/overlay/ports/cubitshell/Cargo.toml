[package]
name = "cubitshell"
description = "Servo embedded on CuBit: SWGL rendering into a CuBit surface."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true

[[bin]]
name = "cubitshell"
path = "src/main.rs"
bench = false

[features]
default = []
bundled = ["servo/bundled"]
media = ["servo/media-gstreamer", "dep:gstreamer"]

[dependencies]
dpi = { workspace = true }
gleam = { workspace = true }
glow = { workspace = true }
log = { workspace = true }
servo = { workspace = true }
surfman = { workspace = true }
swgl = "0.70"
url = { workspace = true }

[target.'cfg(target_os = "cubit")'.dependencies]
# Expanded by patch_servo.py for the selected Servo checkout. Use the same
# rasterizer with Servo's Rust runtime, not a second no_std allocator/panic ABI.
gstreamer = { workspace = true, optional = true }
aws-lc-rs = { workspace = true }
aws-lc-sys = { version = "=0.45.0", default-features = false }
time = { workspace = true }
cubit-fonts = { path = "__CUBIT_FONTS__" }
